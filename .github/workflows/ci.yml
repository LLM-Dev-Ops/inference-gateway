name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests and production audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.88.0 fmt --all -- --check
      - run: cargo +1.88.0 clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo +1.88.0 test --workspace --all-features --locked
